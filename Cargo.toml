[workspace]
members = ["libvlc-sys"]

[package]
name = "ferricone"
version = "1.0.0"
edition = "2024"
description = "Ferricone Player: a VLC redesign on libVLC 4 with a Rust + Slint interface"
license = "GPL-3.0-or-later"
repository = "https://github.com/NobleDoodle/ferricone"
publish = false

[dependencies]
glow = "0.18"
libvlc-sys = { path = "libvlc-sys" }
# Where the player keeps what it remembers (src/state.rs).
directories = "6"
serde = { version = "1", features = ["derive"] }
toml = "1"
# The subtitle font list (src/pickers.rs); Slint already builds it.
fontique = "0.11"
# The library's thumbnail cache (src/thumbs.rs) and the snapshot test; Slint
# already builds it.
png = "0.17"
# OpenSubtitles' REST API (src/opensubtitles.rs): blocking HTTPS with rustls,
# so no system TLS library is needed on any platform.
ureq = "3"
serde_json = "1"
# Native file dialogs: the XDG portal on Linux (over libdbus, no async runtime).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# ~ pin: the winit accessor is an unstable API that may change in minor releases.
slint = { version = "~1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "accessibility", "unstable-winit-030"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The MPRIS media controls (src/remote/mpris.rs), on libdbus.
dbus = "0.9"
dbus-crossroads = "0.5"
khronos-egl = { version = "6", features = ["static"] }
notify = "8"
# File drops on Wayland, which winit 0.30 doesn't receive (src/drop/wayland.rs).
rustix = { version = "1", features = ["event", "pipe"] }
wayland-client = { version = "0.31", features = ["system"] }

[dev-dependencies]
# Headless rendering for the snapshot test (src/snapshot.rs), test builds only.
slint = { version = "~1.18.1", default-features = false, features = ["renderer-software", "software-renderer-path"] }

[build-dependencies]
slint-build = "1.18.1"
